[project]
name = "noclear"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HQ141", email = "hamdan90@live.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "paddleocr[doc-parser]>=3.7.0",
    "paddlepaddle>=3.3.1",
    "paddlex>=3.7.2",
    "python-multipart>=0.0.18",
    "uvicorn>=0.32.0",
]

[project.scripts]
noclear = "noclear:main"
noclear-web = "noclear.web:serve"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
